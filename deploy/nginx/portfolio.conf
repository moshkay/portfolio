# Nginx reverse proxy for the portfolio container.
# Place at /etc/nginx/sites-available/portfolio.conf and symlink into
# /etc/nginx/sites-enabled/, then run certbot to add the TLS (443) block.

server {
    listen 80;
    listen [::]:80;
    server_name moshcore.com.ng www.moshcore.com.ng;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
